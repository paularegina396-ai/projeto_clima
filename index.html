<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="theme-day"> <!-- Classe padrão para transição de cores -->
    <div class="container">
        <h1>Previsão do Tempo</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Digite a cidade (ex: São Paulo)" autocomplete="off">
            <button id="searchBtn">Buscar</button>
        </div>

        <!-- Estado de Carregamento (UX Loading State) -->
        <div id="loadingState" class="hidden">Buscando informações...</div>

        <!-- Resultados -->
        <div id="weatherResult" class="hidden">
            <h2 id="cityName"></h2>
            <p id="currentDate" class="date-text"></p>
            
            <div class="weather-card">
                <!-- Ícone do clima -->
                <img id="weatherIcon" src="" alt="Ícone do clima" class="weather-icon">
                
                <div class="weather-info">
                    <p class="temperature"><span id="temperature">--</span>°C</p>
                    <p id="weatherDescription" class="description">--</p>
                </div>
            </div>
        </div>

 <!-- Mensagens de erro -->
        <p id="errorMessage" class="hidden error"></p>
    </div> <!-- Fim do container principal -->

    <!-- NOVOS ALERTAS DE PRIVACIDADE E LICENCIAMENTO -->
    <footer class="footer-alerts">
        <p>🔒 Esta aplicação não coleta, armazena ou compartilha dados pessoais. As buscas são processadas em tempo real e não são registradas no servidor.</p>
        <p>📊 Dados meteorológicos fornecidos por <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> sob licença CC BY 4.0</p>
    </footer>

    <script src="assets/js/api.js"></script>
</body>
</html>
